<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Painel Clima Braserv 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#293684;--yellow:#E8AA21;--blue:#3E7AC2;--orange:#F7873B;--lime:#A8B937;--bg:#F3F4F9;--card:#fff;--line:#DDE0EE;--text:#50567a;--avatar:#E9EBF5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.5 "Montserrat",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.exo{font-family:"Exo 2","Montserrat",sans-serif;color:var(--navy);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
[hidden]{display:none!important}
button{font-family:inherit}

/* login */
#login{min-height:100vh;background:var(--navy);display:grid;place-items:center;padding:20px}
.lbox{background:#fff;border-radius:18px;padding:32px;width:min(420px,100%)}
.brand{font:800 14px "Exo 2",sans-serif;letter-spacing:.14em;color:var(--navy)}
.lbox h1{font-size:28px;margin:10px 0 6px}
.lbox p{margin:0 0 18px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--navy);margin-bottom:14px}
input,select{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px 14px;font:500 14.5px "Montserrat",sans-serif;color:var(--navy)}
input:focus,select:focus{outline:2px solid var(--blue);outline-offset:1px}
.btn{background:var(--yellow);color:var(--navy);border:0;border-radius:10px;font:700 14.5px "Montserrat",sans-serif;padding:12px 22px;cursor:pointer}
.btn.sec{background:#fff;border:1.5px solid var(--navy)}
.btn:disabled{opacity:.5;cursor:wait}
.msg{margin-top:12px;font-weight:600;color:#b4531a}

/* topo */
.top{background:var(--navy);color:#fff;padding:22px 0}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between}
.top h1{color:#fff;font-size:26px;font-weight:800}
.top small{color:#cfd4ee;font-size:12.5px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.top .btn.sec{background:transparent;color:#fff;border-color:#8993cf}

.filtros{position:sticky;top:0;z-index:10;background:#fff;box-shadow:0 2px 12px rgba(41,54,132,.12)}
.filtros .wrap{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:12px;padding-top:12px;padding-bottom:12px;align-items:end}
.filtros label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--navy)}
.filtros select{padding:9px 12px}
@media(max-width:860px){.filtros .wrap{grid-template-columns:1fr 1fr}}

main{padding:26px 0 60px}
section{margin-top:30px}
section>h2{font-size:22px;font-weight:800;margin-bottom:4px}
.sub{margin:0 0 14px;max-width:760px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){.g4{grid-template-columns:1fr 1fr}.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.kpi .rot{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.kpi .val{font:800 38px/1.1 "Exo 2",sans-serif;color:var(--navy);margin:8px 0 2px}
.kpi small{display:block}
.aviso{background:#fff;border:1.5px solid var(--orange);border-radius:14px;padding:18px 20px;color:var(--navy);font-weight:600}

.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:6px;background:var(--navy);color:#fff}
.row{display:grid;grid-template-columns:170px 1fr 128px;gap:12px;align-items:center;margin:9px 0}
.row.s{grid-template-columns:150px 1fr 128px;margin:6px 0 6px 14px;font-size:13px}
@media(max-width:560px){.row,.row.s{grid-template-columns:1fr;gap:4px}}
.row .nm{font-weight:600;color:var(--navy)}
.trk{height:12px;background:var(--avatar);border-radius:99px;overflow:hidden}
.fil{height:100%;border-radius:99px}
.row .vl{white-space:nowrap;text-align:right;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.row .vl span{font-weight:500;color:var(--text);font-size:12px;margin-left:4px}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin-top:12px}
.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.nps{display:flex;height:26px;border-radius:8px;overflow:hidden;margin:10px 0 8px}
.nps div{display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}

table.hm{border-collapse:separate;border-spacing:4px;width:100%;font-size:13px}
.hm th{font-weight:700;color:var(--navy);text-align:center;padding:6px 4px;font-size:12px}
.hm th:first-child,.hm td:first-child{text-align:left;white-space:nowrap;padding-right:10px;font-weight:600;color:var(--navy)}
.hm td{text-align:center;border-radius:8px;padding:11px 4px;font-weight:700;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}

ol.it{margin:0;padding:0;list-style:none}
ol.it li{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:start;padding:11px 0;border-top:1px dashed var(--line)}
ol.it li:first-child{border-top:0}
.pct{font:800 17px "Exo 2",sans-serif;text-align:center;border-radius:8px;padding:6px 0}
.it small{color:var(--text);display:block;margin-top:2px}
.cm{padding:12px 0;border-top:1px dashed var(--line);color:var(--navy)}
.cm:first-of-type{border-top:0}
.pill{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--avatar);color:var(--navy)}
.foot{color:var(--text);font-size:12.5px;margin-top:28px}

.int{margin:10px 0 0;font-size:12.5px;line-height:1.45;color:var(--text)}
.leit{margin-top:14px;padding:12px 14px;border-radius:10px;background:#F3F4F9;border-left:4px solid var(--navy);font-size:13px;line-height:1.55;color:var(--navy)}
.leit.atencao{border-left-color:var(--yellow);background:#FDF6E3}
.leit.prioridade{border-left-color:var(--orange);background:#FEF0E6}
.rd{display:block;margin-top:5px;color:var(--navy);font-size:12.5px;line-height:1.45}
.estr{border:1.5px solid var(--navy)}
.estr ul{margin:10px 0 0;padding-left:18px}.estr li{margin:9px 0;color:var(--navy);line-height:1.5}
.estr li.alerta{background:#FEF0E6;border-radius:8px;padding:8px 10px;margin-left:-10px;list-style-position:inside}
.okr{border-top:4px solid var(--navy)}.okr.pres{border-top-color:var(--lime)}
.okr h3{font-size:16px;margin:8px 0}.okr p{margin:6px 0;font-size:13px;color:var(--navy)}
#mais summary{cursor:pointer;font:800 17px "Exo 2",sans-serif;color:var(--navy)}
#mais p,#mais li{font-size:13px;line-height:1.55}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 22px;border-bottom:2px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:12px 16px;font:700 14px "Montserrat",sans-serif;color:var(--text);cursor:pointer}
.tabs button.on{color:var(--navy);border-bottom-color:var(--yellow)}
.tab{display:none}.tab.on{display:block}
.tab>section:first-child{margin-top:0}
.dn{display:flex;flex-direction:column;align-items:center;gap:4px}.dn svg{width:132px;height:132px}.dn small{font-weight:600;color:var(--navy);text-align:center}
.radar svg{width:100%;max-width:640px;height:auto;display:block;margin:0 auto}
.lg2{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:12px;margin-top:6px}.lg2 i{display:inline-block;width:12px;height:3px;margin-right:6px;vertical-align:middle}
.dist{display:flex;height:22px;border-radius:6px;overflow:hidden}.dist div{display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;min-width:0;overflow:hidden}
.drow{display:grid;grid-template-columns:170px 1fr;gap:12px;align-items:center;margin:10px 0}
@media(max-width:560px){.drow{grid-template-columns:1fr;gap:4px}}
.seg{display:inline-flex;border:1.5px solid var(--navy);border-radius:10px;overflow:hidden;margin-bottom:16px}
.seg button{background:#fff;border:0;padding:9px 18px;font:700 13.5px "Montserrat",sans-serif;color:var(--navy);cursor:pointer}.seg button.on{background:var(--navy);color:#fff}
.call{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
@media(max-width:800px){.call{grid-template-columns:1fr}}
.call .card b.big{display:block;font:800 22px "Exo 2",sans-serif;color:var(--navy);margin:6px 0 2px}
table.sc{border-collapse:separate;border-spacing:0 4px;width:100%;font-size:13px;min-width:760px}
.sc th{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--navy);padding:6px 8px;text-align:center}
.sc th:first-child,.sc td:first-child{text-align:left}
.sc td{padding:10px 8px;text-align:center;background:#F7F8FC;font-variant-numeric:tabular-nums}
.sc td:first-child{font-weight:700;color:var(--navy);border-radius:10px 0 0 10px}.sc td:last-child{border-radius:0 10px 10px 0}
.sc td.h{font-weight:700}
.sc tr.un{cursor:pointer}.sc tr.un:hover td{outline:0;box-shadow:inset 0 0 0 100px rgba(41,54,132,.05)}
body.pres .top,body.pres .filtros{display:none}
body.pres{font-size:17px}body.pres .kpi .val{font-size:46px}body.pres main{padding-top:20px}
#sairpres{display:none;position:fixed;right:14px;bottom:14px;z-index:50}body.pres #sairpres{display:block}
body.embed .top{display:none}
body.embed main{padding-top:14px}
body.embed #login{min-height:100vh}
@media print{.filtros,.acts,#mais,.tabs,#sairpres{display:none!important}.tab{display:block!important;margin-bottom:24px}.top{background:#fff;color:var(--navy)}.top h1{color:var(--navy)}body{background:#fff}.card{break-inside:avoid}}
</style>
</head>
<body>

<div id="login">

    <div class="brand">BRASERV</div>

</div>

<div id="app" hidden>

/* Faixas de leitura (editáveis): referência interna da Braserv, não são cortes oficiais do GPTW */
const BANDAS = {forte:80, atencao:60};
const nivel = p => p==null?null:(p>=BANDAS.forte?"forte":p>=BANDAS.atencao?"atencao":"prioridade");

const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (n,d=0)=>Number(n).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});

let token = null, rows = [], F = {filial:"",area:"",tempo:"",funcao:""}, verMais = {};

/* ===== Acesso ===== */
async function entrar(email, senha){
  const r = await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",
    headers:{"Content-Type":"application/json",apikey:SUPABASE_ANON_KEY},body:JSON.stringify({email,password:senha})});
  if(!r.ok) throw new Error("E-mail ou senha incorretos.");
  return (await r.json()).access_token;
}
async function carregar(){
  let todos = [], de = 0, passo = 1000;
  while(true){
    const r = await fetch(`${SUPABASE_URL}/rest/v1/respostas?select=*&order=criado_em.desc&limit=${passo}&offset=${de}`,
      {headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+token}});
    if(r.status===401) throw new Error("sessao");
    if(!r.ok) throw new Error("Não foi possível ler as respostas.");
    const lote = await r.json();
    todos = todos.concat(lote);
    if(lote.length < passo) break;
    de += passo;
  }
  rows = todos.map(r=>{ const m={}; (r.itens||[]).forEach(i=>{m[i.id]=i.v}); r.m=m; return r; });
  $("#atual").textContent = "Atualizado em " + new Date().toLocaleString("pt-BR");
  montarFiltros(); render();
}

/* ===== Cálculos ===== */
const fav = a => a.length ? a.filter(v=>v>=5).length/a.length*100 : null;
const med = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
function valores(rs, ids){ const o=[]; rs.forEach(r=>ids.forEach(id=>{ if(r.m[id]!=null) o.push(r.m[id]); })); return o; }
const idsDe = fn => Object.keys(Q).filter(id=>fn(Q[id]));
function enps(rs){
  if(!rs.length) return null;
  const p=rs.filter(r=>r.enps>=9).length, d=rs.filter(r=>r.enps<=6).length, n=rs.length;
  return {score:Math.round((p-d)/n*100), p:p/n*100, d:d/n*100, neu:(n-p-d)/n*100};
}
function filtrar(base){
  return (base||rows).filter(r=>(!F.filial||r.filial===F.filial)&&(!F.area||r.area===F.area)&&(!F.tempo||r.tempo===F.tempo)&&(!F.funcao||r.funcao===F.funcao));
}
const cor = p => p==null?"#ccd":(p>=80?"var(--navy)":p>=60?"var(--yellow)":"var(--orange)");
const corTxt = p => p==null?"var(--text)":(p>=80?"#fff":"var(--navy)");

/* ===== Filtros ===== */
function opcoes(campo){ return [...new Set(rows.map(r=>r[campo]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR")); }
function montarFiltros(){
  [["filial","Todas as filiais"],["area","Todas as áreas"],["tempo","Todos os tempos"],["funcao","Todas as funções"]].forEach(([c,t])=>{
    const el=$("#f-"+c), atual=F[c];
    el.innerHTML = `<option value="">${t}</option>` + opcoes(c).map(o=>`<option${o===atual?" selected":""}>${esc(o)}</option>`).join("");
  });
}

/* ===== Blocos ===== */
function barra(nome, p, m, peq, dica){
  return `<div class="row${peq?" s":""}"><div class="nm" title="${esc(dica||"")}">${esc(nome)}</div>
    <div class="trk"><div class="fil" style="width:${p==null?0:p}%;background:${cor(p)}"></div></div>
    <div class="vl">${p==null?"—":fmt(p)+"%"}<span>${m==null?"":"média "+fmt(m,1)}</span></div></div>`;
}
function blocoDimensoes(rs, lista){
  return lista.map(d=>{
    const ids = idsDe(q=>q.dim===d.nome), v = valores(rs, ids);
    let h = `<div class="card"><span class="chip">${esc(d.nome)}</span>` + barra("Geral", fav(v), med(v));
    d.subs.forEach(s=>{ const vs = valores(rs, idsDe(q=>q.dim===d.nome&&q.sub===s)); h += barra(s, fav(vs), med(vs), true, (INFO[d.nome+"|"+s]||{}).sig); });
    return h + leituraDim(rs,d) + "</div>";
  }).join("");
}
function mapaCalor(){
  const base = filtrar(rows.map(r=>r)).length ? null : null; /* placeholder para clareza */
  const semFilial = rows.filter(r=>(!F.area||r.area===F.area)&&(!F.tempo||r.tempo===F.tempo)&&(!F.funcao||r.funcao===F.funcao));
  const filiais = [...new Set(semFilial.map(r=>r.filial))].sort((a,b)=>a.localeCompare(b,"pt-BR"));
  if(filiais.length<2) return "";
  let h = `<section><h2>Mapa por filial</h2><p class="sub">% de respostas favoráveis (notas 5 e 6) por dimensão. Células com menos de ${MIN_GRUPO} respostas ficam ocultas para proteger o anonimato.</p><div class="card scroll"><table class="hm"><tr><th></th>`;
  filiais.forEach(f=>{ h += `<th>${esc(f)}<br><span style="font-weight:500">${semFilial.filter(r=>r.filial===f).length} resp.</span></th>`; });
  h += "</tr>";
  DIMS.forEach(d=>{

function itensLista(arr,forca){ const auto=forca==="auto";

function comentarios(rs){

/* ===== Leituras interpretativas ===== */
function subStats(rs){
  const o=[]; DIMS.forEach(d=>d.subs.forEach(s=>{ const v=valores(rs,idsDe(q=>q.dim===d.nome&&q.sub===s)); if(v.length) o.push({dim:d.nome,sub:s,p:fav(v),i:INFO[d.nome+"|"+s]||{}}); }));
  return o.sort((a,b)=>b.p-a.p);
}
function intAdesao(n,filtrando){
  if(filtrando) return `Recorte com ${n} respostas. Quanto menor o grupo, maior a margem de erro; use como indicação, não como veredito.`;
  const N=TOTAL_COLABORADORES, ad=n/N*100, me=n>=N?0:1.96*Math.sqrt(.25/n*(N-n)/(N-1))*100;
  const t = ad>=80?"Base muito representativa: os resultados refletem bem a empresa.":ad>=60?"Boa representatividade: os resultados são confiáveis para decisões gerais.":"Adesão abaixo de 60%: leia com cautela e reforce a divulgação nas filiais com menos respostas.";
  return `Margem de erro de ±${fmt(me,1)} p.p. (95% de confiança). ${t}`;
}
function intConfianca(p){
  const lv=nivel(p);
  return lv==="forte"?"Média das cinco dimensões em nível forte: as pessoas confiam na empresa. Foco em manter e em tratar os pontos isolados.":lv==="atencao"?"Confiança em nível intermediário: há base, mas existem dimensões que precisam de plano de ação (veja os pontos de atenção abaixo).":"Confiança baixa: risco para engajamento e retenção. Priorizar um plano de ação com a direção e acompanhar de perto.";
}
function intGeral(p,conf){
  const t=nivel(p)==="forte"?"A maioria considera a Braserv um excelente lugar para trabalhar.":nivel(p)==="atencao"?"Parte relevante das pessoas ainda não vê a Braserv como excelente lugar para trabalhar.":"Menos de 60% veem a Braserv como excelente lugar para trabalhar: sinal de alerta.";
  return t+(p!=null&&conf!=null&&conf-p>=8?" A confiança está acima desta nota: o clima é melhor do que a percepção geral, o que sugere fatores específicos a investigar.":"");
}
function leituraDim(rs,d){
  const subs=subStats(rs).filter(x=>x.dim===d.nome);
  if(!subs.length) return "";
  const geral=fav(valores(rs,idsDe(q=>q.dim===d.nome))), lv=nivel(geral), top=subs[0], low=subs[subs.length-1];
  let t=`<b>${fmt(geral)}% favorável: ${NIVEL_TXT[lv]}.</b> `;
  if(nivel(low.p)==="forte") t+=`Todas as subdimensões estão em nível forte. ${top.i.forte||""} Manter as práticas atuais e acompanhar na próxima rodada.`;
  else{
    if(nivel(top.p)==="forte") t+=`Ponto mais forte: ${esc(top.sub)} (${fmt(top.p)}%). ${top.i.forte||""} `;
    t+=`Ponto de atenção: <b>${esc(low.sub)}</b> (${fmt(low.p)}%). ${nivel(low.p)==="prioridade"?(low.i.baixo||""):"Pede atenção e acompanhamento."} <b>Ação sugerida:</b> ${low.i.acao||""}`;
  }
  return `<div class="leit ${lv}">${t}</div>`;
}
function enpsLeitura(n){
  const z = n.score>=75?"zona de excelência":n.score>=50?"zona de qualidade":n.score>=0?"zona de aperfeiçoamento":"zona crítica";
  const t = n.score>=75?"A maioria recomenda a Braserv com entusiasmo, o que favorece indicação de candidatos e retenção."
    : n.score>=50?"Há mais promotores do que detratores com folga; o desafio é converter os neutros em promotores."
    : n.score>=0?"Os promotores superam os detratores por pouco; vale entender o que separa quem recomenda de quem não recomenda."
    : "Há mais detratores do que promotores: risco de saída de pessoas e de imagem como empregadora. Investigar as causas com os comentários e os pontos de atenção.";
  return `<b>${z}.</b> ${fmt(n.p)}% são promotores e ${fmt(n.d)}% detratores. ${t}`;
}
function leituraLideranca(vg,vd){
  const g=fav(vg), d=fav(vd); if(g==null||d==null) return "";
  const dif=g-d;
  const t = Math.abs(dif)<5 ? "Gestor direto e direção são vistos de forma parecida."
    : dif>0 ? `O gestor direto (${fmt(g)}%) é mais bem avaliado que a direção (${fmt(d)}%): a confiança nasce na proximidade. Vale a direção ficar mais presente e comunicar melhor as decisões.`
    : `A direção (${fmt(d)}%) é mais bem avaliada que o gestor direto (${fmt(g)}%): o ponto de atenção está na liderança de proximidade. Priorizar o desenvolvimento de gestores (PDL) e o feedback 180°.`;
  return `<div class="leit ${nivel(Math.min(g,d))}">${t}</div>`;

function leituraItem(x,forca,semAcao){
  const q=Q[x.id], i=INFO[q.dim+"|"+q.sub]||{};
  return forca ? `${fmt(x.p)}% avaliam favoravelmente: <b>${esc(q.f||"")}</b> é um ponto forte a preservar.`

function textoFiliais(semFilial, filiais, campo){ campo=campo||"filial";
  let melhor=null;

    const l=filiais.map(f=>{const g=semFilial.filter(r=>r[campo]===f); return g.length>=MIN_GRUPO?{f,p:fav(valores(g,idsDe(q=>q.dim===d.nome)))}:null;}).filter(Boolean).sort((a,b)=>b.p-a.p);
    if(l.length>=2){ const gap=l[0].p-l[l.length-1].p; if(!melhor||gap>melhor.gap) melhor={d:d.nome,hi:l[0],lo:l[l.length-1],gap}; }
  });

}
function leituraEstrategica(rs,n,vG,vg,vd){
  const subs=subStats(rs); if(!subs.length) return "";
  const topo=subs[0], base=subs[subs.length-1], conf=fav(vG);
  const valSubs=subs.filter(x=>x.dim==="Valores Braserv");
  const li=[];
  li.push(`<li><b>Panorama:</b> índice de confiança de ${fmt(conf)}% (${NIVEL_TXT[nivel(conf)]}) e eNPS de ${n.score>0?"+":""}${n.score}. ${n.score>=50?"Cenário favorável, com foco em sustentar e aprofundar.":n.score>=0?"Cenário intermediário: há base boa, mas com pontos que precisam de plano.":"Cenário de alerta: exige plano de ação da liderança."}</li>`);
  li.push(`<li><b>Maior força:</b> ${esc(topo.sub)} em ${esc(topo.dim)} (${fmt(topo.p)}%). ${nivel(topo.p)==="forte"?(topo.i.forte||""):"É o melhor resultado relativo, mas ainda abaixo do nível forte ("+BANDAS.forte+"%)."}</li>`);
  li.push(`<li><b>Maior prioridade:</b> ${esc(base.sub)} em ${esc(base.dim)} (${fmt(base.p)}%). ${nivel(base.p)==="forte"?"Mesmo o ponto mais baixo está em nível forte; manter o acompanhamento.":(base.i.baixo||"")+` <b>Ação:</b> ${base.i.acao||""} <b>Dono sugerido:</b> ${base.i.dono||""}.`}</li>`);
  if(valSubs.length>1) li.push(`<li><b>Valores:</b> o mais vivido é <b>${esc(valSubs[0].sub)}</b> (${fmt(valSubs[0].p)}%) e o menos percebido é <b>${esc(valSubs[valSubs.length-1].sub)}</b> (${fmt(valSubs[valSubs.length-1].p)}%).</li>`);
  const vida=valSubs.find(x=>x.sub==="Compromisso com a Vida");
  if(vida && vida.p<BANDAS.forte) li.push(`<li class="alerta"><b>Alerta de segurança:</b> Compromisso com a Vida está em ${fmt(vida.p)}%, abaixo do nível forte (${BANDAS.forte}%). Por ser o valor com maior impacto humano e legal, recomenda-se plano de ação imediato com SMS e lideranças, antes dos demais temas.</li>`);
  const lg=fav(vg), ld=fav(vd);
  if(lg!=null&&ld!=null&&Math.abs(lg-ld)>=5) li.push(`<li><b>Liderança:</b> ${lg>ld?"gestor direto "+fmt(lg)+"% x direção "+fmt(ld)+"%: a direção precisa se aproximar das pessoas.":"direção "+fmt(ld)+"% x gestor direto "+fmt(lg)+"%: o foco é desenvolver a liderança de proximidade."}</li>`);
  return `<section><div class="card estr"><span class="chip">Leitura estratégica para a Gestão Humana</span><ul>${li.join("")}</ul></div></section>`;
}
function okrs(rs){
  const subs=subStats(rs); if(!subs.length) return "";
  const baixos=subs.filter(x=>x.p<BANDAS.forte).slice(-3).reverse();

  if(!baixos.length&&!fortes.length) return "";

  baixos.forEach(x=>{ const meta=Math.min(95,Math.round(x.p+10));
    h+=`<div class="card okr"><span class="chip" style="background:var(--orange);color:var(--navy)">Melhorar</span><h3>Elevar ${esc(x.sub)} (${esc(x.dim)})</h3>

  fortes.forEach(x=>{ h+=`<div class="card okr pres"><span class="chip" style="background:var(--lime);color:var(--navy)">Preservar</span><h3>Manter ${esc(x.sub)} (${esc(x.dim)})</h3>

  return h+"</div></section>";
}
function comoInterpretar(){

/* ===== Gráficos (SVG, sem bibliotecas externas) ===== */
const HEX={navy:"#293684",yellow:"#E8AA21",blue:"#3E7AC2",orange:"#F7873B",lime:"#A8B937",grey:"#9AA0C4"};
const corHex = p => p==null?"#ccd":(p>=BANDAS.forte?HEX.navy:p>=BANDAS.atencao?HEX.yellow:HEX.orange);
function donut(p,centro,sub,col){
  const r=46,c=2*Math.PI*r,v=Math.max(0,Math.min(100,p||0))/100*c;
  return `<div class="dn"><svg viewBox="0 0 120 120" role="img" aria-label="${esc(sub)}: ${esc(centro)}"><circle cx="60" cy="60" r="${r}" fill="none" stroke="#E9EBF5" stroke-width="13"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="${col}" stroke-width="13" stroke-linecap="round" stroke-dasharray="${v} ${c}" transform="rotate(-90 60 60)"/><text x="60" y="67" text-anchor="middle" font-family="Exo 2,sans-serif" font-weight="800" font-size="24" fill="#293684">${esc(centro)}</text></svg><small>${esc(sub)}</small></div>`;
}
function rotulo(t,x,y,anc){
  const w=t.split(" "); let l1=t,l2="";
  if(t.length>14&&w.length>1){ let best=1,bd=1e9; for(let i=1;i<w.length;i++){ const d=Math.abs(w.slice(0,i).join(" ").length-w.slice(i).join(" ").length); if(d<bd){bd=d;best=i;} } l1=w.slice(0,best).join(" "); l2=w.slice(best).join(" "); }
  const y0=l2?y-3:y+4;
  return `<text x="${x.toFixed(1)}" y="${y0.toFixed(1)}" text-anchor="${anc}" font-size="14" font-weight="700" fill="#293684">${esc(l1)}${l2?`<tspan x="${x.toFixed(1)}" dy="16">${esc(l2)}</tspan>`:""}</text>`;
}
function radar(labels, series){
  const S=420,c=S/2,R=S/2-78,n=labels.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n,r=R*v/100;return [c+r*Math.cos(a),c+r*Math.sin(a)];};
  let g="";
  [20,40,60,80,100].forEach(l=>{ g+=`<polygon points="${labels.map((_,i)=>pt(i,l).map(x=>x.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="${l===80?"#B9BFE0":"#E3E6F2"}" ${l===80?'stroke-dasharray="4 3"':""}/>`; });
  g+=`<text x="${c+4}" y="${c-R*0.8-3}" font-size="10" fill="#9AA0C4">80%</text>`;
  labels.forEach((t,i)=>{ const [x,y]=pt(i,100),[lx,ly]=pt(i,116),ca=Math.cos(-Math.PI/2+i*2*Math.PI/n);
    g+=`<line x1="${c}" y1="${c}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#E3E6F2"/>${rotulo(t,lx,ly,Math.abs(ca)<.3?"middle":ca>0?"start":"end")}`; });
  series.forEach(s=>{ const pts=s.v.map((v,i)=>pt(i,v==null?0:v));
    g+=`<polygon points="${pts.map(q=>q.map(x=>x.toFixed(1)).join(",")).join(" ")}" fill="${s.cor}" fill-opacity="${s.base?0:.18}" stroke="${s.cor}" stroke-width="${s.base?2:3}" ${s.base?'stroke-dasharray="6 4"':""}/>`;
    if(!s.base) pts.forEach((q,i)=>{ g+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="4.5" fill="${s.cor}"/>`; }); });
  const lg=series.map(s=>`<span><i style="background:${s.cor}"></i>${esc(s.nome)}</span>`).join("");
  return `<div class="radar"><svg viewBox="-90 0 ${S+180} ${S}" role="img" aria-label="Gráfico de radar">${g}</svg><div class="lg2">${lg}</div></div>`;
}
function linhaTempo(rs){
  const d={}; rs.forEach(r=>{const k=String(r.criado_em||"").slice(0,10); if(k) d[k]=(d[k]||0)+1;});
  const ks=Object.keys(d).sort(); if(ks.length<2) return "";
  const W=560,H=130,max=Math.max(...ks.map(k=>d[k])),bw=Math.max(3,Math.min(26,(W-30)/ks.length-3));
  const x=i=>20+i*((W-40)/Math.max(1,ks.length-1));
  let g=ks.map((k,i)=>{const h=d[k]/max*(H-34);return `<rect x="${(x(i)-bw/2).toFixed(1)}" y="${(H-20-h).toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="3" fill="${HEX.blue}"><title>${k}: ${d[k]}</title></rect>`;}).join("");
  const br=k=>k.slice(8,10)+"/"+k.slice(5,7);
  g+=`<text x="20" y="${H-4}" font-size="11" fill="#7a80a6">${br(ks[0])}</text><text x="${W-20}" y="${H-4}" text-anchor="end" font-size="11" fill="#7a80a6">${br(ks[ks.length-1])}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Respostas por dia">${g}</svg>`;
}
function distribBloco(rs,lista){
  return lista.map(d=>{
    const v=valores(rs,idsDe(q=>q.dim===d.nome)); if(!v.length) return "";
    const t=v.length,a=v.filter(x=>x<=2).length/t*100,b=v.filter(x=>x===3||x===4).length/t*100,c=100-a-b;

    return `<div class="drow"><div class="nm" style="font-weight:600;color:var(--navy)">${esc(d.nome)}</div><div class="dist">${seg(a,HEX.orange)}${seg(b,"#E6E8F4","#293684")}${seg(c,HEX.navy)}</div></div>`;
  }).join("")+`<div class="leg"><span><i style="background:var(--orange)"></i>Desfavorável (notas 1–2)</span><span><i style="background:#E6E8F4"></i>Neutro (3–4)</span><span><i style="background:var(--navy)"></i>Favorável (5–6)</span></div>`;
}

  const top=lin[0], low=lin[lin.length-1], best=[...lin].sort((a,b)=>b.enps-a.enps)[0];
  h+=`<div class="call"><div class="card"><div class="rot" style="font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase">Maior índice de confiança</div><b class="big">${esc(top.nm)}</b><small>${fmt(top.conf)}% favorável · ${top.n} respostas</small></div>
   <div class="card"><div class="rot" style="font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase">Menor índice de confiança</div><b class="big">${esc(low.nm)}</b><small>${fmt(low.conf)}% favorável · ${low.n} respostas</small></div>
   <div class="card"><div class="rot" style="font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase">Amplitude · melhor eNPS</div><b class="big">${fmt(top.conf-low.conf)} p.p.</b><small>${esc(best.nm)} lidera no eNPS (${best.enps>0?"+":""}${best.enps})</small></div></div>`;
  h+=`<div class="card"><span class="chip">Ranking por índice de confiança</span>${lin.map(x=>barra(x.nm,x.conf,null)).join("")}</div>`;
  h+=`<div class="card scroll" style="margin-top:16px"><span class="chip">Scorecard por dimensão (% favorável)</span><table class="sc" style="margin-top:8px"><tr><th>${campo==="filial"?"Filial":"Área"}</th><th>Resp.</th>${lin.some(x=>x.ad!=null)?"<th>Adesão</th>":""}<th>Confiança</th><th>eNPS</th>${DIMS.map(d=>`<th>${esc(d.nome.replace("Valores Braserv","Valores"))}</th>`).join("")}</tr>`
   +lin.map(x=>`<tr class="un" data-c="${campo}" data-v="${esc(x.nm)}"><td>${esc(x.nm)}</td><td>${x.n}</td>${lin.some(y=>y.ad!=null)?`<td>${x.ad==null?"—":fmt(x.ad)+"%"}</td>`:""}<td class="h" style="background:${cor(x.conf)};color:${corTxt(x.conf)}">${fmt(x.conf)}%</td><td class="h">${x.enps>0?"+":""}${x.enps}</td>${x.ds.map(p=>`<td class="h" style="background:${cor(p)};color:${corTxt(p)}">${p==null?"—":fmt(p)+"%"}</td>`).join("")}</tr>`).join("")
   +`</table></div>`;
  h+=textoFiliais(base,lin.map(x=>x.nm),campo);
  if(ocultas) h+=`<p class="foot">${ocultas} ${campo==="filial"?"filial(is)":"área(s)"} com menos de ${MIN_GRUPO} respostas não aparece(m) acima.</p>`;
  return h+"</section>";
}

/* ===== Montagem ===== */
function irTab(t){
  tab=t;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  document.querySelectorAll(".tab").forEach(s=>s.classList.toggle("on",s.dataset.t===t));
  window.scrollTo({top:0});
}
function render(){
  const rs = filtrar();
  const el = $("#conteudo");
  const filtrando = Object.values(F).some(Boolean);
  if(!rows.length){ el.innerHTML = `<div class="aviso">Ainda não há respostas registradas.</div>`; return; }
  if(rs.length < MIN_GRUPO){
    el.innerHTML = `<div class="aviso">Este recorte tem apenas ${rs.length} resposta${rs.length===1?"":"s"}. Para proteger o anonimato, resultados só aparecem para grupos com ${MIN_GRUPO} ou mais respostas. Escolha um recorte mais amplo.</div>`; return;
  }
  const n = enps(rs);
  const idsG = idsDe(q=>GPTW.includes(q.dim)), vG = valores(rs, idsG);
  const geral = rs.map(r=>r.geral);
  const adesao = !filtrando ? `${fmt(rows.length/TOTAL_COLABORADORES*100)}% de ${TOTAL_COLABORADORES} colaboradores` : `de ${rows.length} no total`;
  const vg = valores(rs, idsDe(q=>q.l==="g")), vd = valores(rs, idsDe(q=>q.l==="d"));
  const stats = idsDe(()=>true).map(id=>({id, p:fav(valores(rs,[id]))})).filter(x=>x.p!=null).sort((a,b)=>b.p-a.p);
  const dg=DIMS.filter(d=>GPTW.includes(d.nome)), dv=DIMS.filter(d=>!GPTW.includes(d.nome));
  const favDim=(lista,base)=>lista.map(d=>fav(valores(base,idsDe(q=>q.dim===d.nome))));
  const valSubs=(dv[0]?dv[0].subs:[]);
  const favSub=(base)=>valSubs.map(s=>fav(valores(base,idsDe(q=>q.dim==="Valores Braserv"&&q.sub===s))));
  const serieG=[{nome:filtrando?"Recorte selecionado":"Braserv",v:favDim(dg,rs),cor:HEX.navy}], serieV=[{nome:filtrando?"Recorte selecionado":"Braserv",v:favSub(rs),cor:HEX.orange}];
  if(filtrando){ serieG.push({nome:"Braserv (todas)",v:favDim(dg,rows),cor:HEX.grey,base:true}); serieV.push({nome:"Braserv (todas)",v:favSub(rows),cor:HEX.grey,base:true}); }
  const ad=rows.length/TOTAL_COLABORADORES*100;

  const T={};
  T.visao = leituraEstrategica(rs,n,vG,vg,vd) + `<div class="grid g4" style="margin-top:22px">
    <div class="card kpi"><div class="rot">Respostas</div><div class="val">${rs.length}</div><small>${adesao}</small><p class="int">${intAdesao(rs.length,filtrando)}</p></div>
    <div class="card kpi"><div class="rot">eNPS</div><div class="val">${n.score>0?"+":""}${n.score}</div><small>promotores − detratores</small><p class="int">${enpsLeitura(n)}</p></div>
    <div class="card kpi"><div class="rot">Índice de confiança</div><div class="val">${fmt(fav(vG))}%</div><small>favorável nas 5 dimensões do GPTW</small><p class="int">${intConfianca(fav(vG))}</p></div>
    <div class="card kpi"><div class="rot">Excelente lugar para trabalhar</div><div class="val">${fmt(fav(geral))}%</div><small>notas 5 e 6 · média ${fmt(med(geral),1)}</small><p class="int">${intGeral(fav(geral),fav(vG))}</p></div></div>
  <section><div class="grid g2">
    <div class="card"><span class="chip">Perfil do clima (5 dimensões)</span>${radar(dg.map(d=>d.nome),serieG)}</div>
    <div class="grid" style="align-content:start">
      <div class="card"><span class="chip">Recomendação (eNPS)</span><div class="nps"><div style="background:var(--orange);width:${n.d}%">${n.d>=6?fmt(n.d)+"%":""}</div><div style="background:var(--yellow);color:var(--navy);width:${n.neu}%">${n.neu>=6?fmt(n.neu)+"%":""}</div><div style="background:var(--navy);width:${n.p}%">${n.p>=6?fmt(n.p)+"%":""}</div></div>
        <div class="leg"><span><i style="background:var(--orange)"></i>Detratores (0–6) ${fmt(n.d)}%</span><span><i style="background:var(--yellow)"></i>Neutros (7–8) ${fmt(n.neu)}%</span><span><i style="background:var(--navy)"></i>Promotores (9–10) ${fmt(n.p)}%</span></div></div>
      <div class="card" style="display:flex;gap:18px;justify-content:space-around;flex-wrap:wrap">${donut(fav(vG),fmt(fav(vG))+"%","Confiança",corHex(fav(vG)))}${donut(fav(geral),fmt(fav(geral))+"%","Excelente lugar",corHex(fav(geral)))}${filtrando?"":donut(Math.min(100,ad),fmt(ad)+"%","Adesão",ad>=80?HEX.navy:ad>=60?HEX.yellow:HEX.orange)}</div>
      ${linhaTempo(rs)?`<div class="card"><span class="chip">Respostas por dia</span><div style="margin-top:8px">${linhaTempo(rs)}</div></div>`:""}
    </div></div></section>`;
  T.dimensoes = `<section><h2>Dimensões do GPTW</h2><p class="sub">% de respostas favoráveis (notas 5 e 6) e média na escala de 1 a 6, com a leitura de cada dimensão.</p>
    <div class="grid g2">${blocoDimensoes(rs, dg)}</div>
    <div class="leg"><span><i style="background:var(--navy)"></i>${BANDAS.forte}% ou mais</span><span><i style="background:var(--yellow)"></i>${BANDAS.atencao}% a ${BANDAS.forte-1}%</span><span><i style="background:var(--orange)"></i>abaixo de ${BANDAS.atencao}%</span></div></section>
    <section><h2>Distribuição das respostas</h2><p class="sub">Além do favorável, mostra quantos estão neutros ou desfavoráveis em cada dimensão.</p><div class="card">${distribBloco(rs,DIMS)}</div></section>`;
  T.valores = `<section><h2>Valores Braserv</h2><p class="sub">Como Honestidade, Excelência Empresarial, Responsabilidade Sustentável e Compromisso com a Vida são percebidos no dia a dia.</p>
    <div class="grid g2"><div class="grid" style="align-content:start">${blocoDimensoes(rs, dv)}</div><div class="card"><span class="chip">Perfil dos valores</span>${radar(valSubs,serieV)}</div></div></section>
    <section><h2>O que sustenta cada valor</h2><p class="sub">As afirmações de cada valor, da mais para a menos favorável.</p><div class="grid g2">${valSubs.map(s=>{const l=stats.filter(x=>Q[x.id].dim==="Valores Braserv"&&Q[x.id].sub===s);return `<div class="card"><span class="chip">${esc(s)}</span>${itensLista(l,"auto")}</div>`;}).join("")}</div></section>`;
  T.unidades = unidadesView();
  T.lideranca = `<section><h2>Liderança</h2><p class="sub">Leitura separada entre o gestor direto e a direção.</p><div class="card">${barra("Gestor direto", fav(vg), med(vg))}${barra("Direção", fav(vd), med(vd))}${leituraLideranca(vg,vd)}</div></section>
    <section><h2>Pontos fortes e oportunidades</h2><p class="sub">As afirmações mais e menos favoráveis, base para os OKRs.</p>
    <div class="grid g2"><div class="card"><span class="chip" style="background:var(--navy)">Maiores forças</span>${itensLista(stats.slice(0,5),true)}</div>
    <div class="card"><span class="chip" style="background:var(--orange);color:var(--navy)">Maiores oportunidades</span>${itensLista(stats.slice(-5).reverse(),false)}</div></div></section>`;
  T.acoes = okrs(rs) + comoInterpretar();
  T.comentarios = comentarios(rs);

  el.innerHTML = `<nav class="tabs">${TABS.map(([k,t])=>`<button data-t="${k}">${t}</button>`).join("")}</nav>` +
    TABS.map(([k])=>`<div class="tab" data-t="${k}">${T[k]}</div>`).join("") +
    `<p class="foot">Base: ${rs.length} respostas${filtrando?" no recorte selecionado":""}. % favorável = notas 5 e 6 em escala de 1 a 6. eNPS = % promotores (9–10) menos % detratores (0–6).</p>`;
  irTab(tab);
}

/* ===== Exportações ===== */
function csvCel(v){ let s=String(v==null?"":v); if(/^[=+\-@]/.test(s)) s="'"+s; return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function baixar(nome, linhas){
  const blob = new Blob(["﻿"+linhas.map(l=>l.map(csvCel).join(";")).join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nome; document.body.appendChild(a); a.click(); a.remove();
}
function exportarResumo(){
  const rs = filtrar(); if(rs.length<MIN_GRUPO) return;
  const L = [["id","dimensao","subdimensao","lideranca","afirmacao","n","media","pct_favoravel"]];
  idsDe(()=>true).forEach(id=>{ const v=valores(rs,[id]); L.push([id,Q[id].dim,Q[id].sub,Q[id].l==="g"?"gestor direto":Q[id].l==="d"?"direcao":"",Q[id].t,v.length,fmt(med(v)||0,2),fmt(fav(v)||0,1)]); });
  baixar("clima_braserv_resumo.csv", L);
}
function exportarBruto(){
  const rs = filtrar(); if(rs.length<MIN_GRUPO) return;
  const ids = idsDe(()=>true);
  const L = [["data","filial","area","tempo_empresa","funcao","enps","satisfacao_geral",...ids,"aberta_1","aberta_2","aberta_3"]];
  rs.forEach(r=>{ const ab={}; (r.abertas||[]).forEach(a=>ab[a.n]=a.a);
    L.push([r.criado_em,r.filial,r.area,r.tempo,r.funcao,r.enps,r.geral,...ids.map(id=>r.m[id]==null?"":r.m[id]),ab[1]||"",ab[2]||"",ab[3]||""]); });
  baixar("clima_braserv_respostas.csv", L);
}

/* Exporta um resumo agregado em formato "longo" (uma linha por filial x dimensão x subdimensão),
   pronto para colar numa planilha Excel/Lista do SharePoint que o Portal GH (Power Apps) lê. */
function exportarPortal(){
  if(!rows.length) return;
  const L = [["ciclo","filial","dimensao","subdimensao","n_respondentes","media","pct_favoravel","enps_filial"]];
  const grupos = [["Todas as filiais", rows]].concat(opcoes("filial").map(f=>[f, rows.filter(r=>r.filial===f)]));
  grupos.forEach(([nome, g])=>{
    if(g.length < MIN_GRUPO) return;
    const e = enps(g);
    DIMS.forEach(d=>{
      const todos = valores(g, idsDe(q=>q.dim===d.nome));
      L.push([CICLO, nome, d.nome, "Geral", g.length, fmt(med(todos),2), fmt(fav(todos),1), e.score]);
      d.subs.forEach(s=>{ const v = valores(g, idsDe(q=>q.dim===d.nome&&q.sub===s));
        L.push([CICLO, nome, d.nome, s, g.length, fmt(med(v),2), fmt(fav(v),1), e.score]); });
    });
  });
  baixar("portal_gh_clima_resumo.csv", L);
}
if(new URLSearchParams(location.search).get("embed")==="1") document.body.classList.add("embed");

/* ===== Eventos ===== */
$("#b-portal").addEventListener("click", exportarPortal);
$("#lform").addEventListener("submit", async e=>{
  e.preventDefault(); const b=$("#lbtn"); b.disabled=true; $("#lmsg").textContent="";
  try{
    token = await entrar($("#em").value.trim(), $("#pw").value);
    try{ sessionStorage.setItem("clima_tk", token); }catch(_){}
    await abrir();
  }catch(err){ $("#lmsg").textContent = err.message==="sessao"?"Sessão expirada.":err.message; }
  b.disabled=false;
});
async function abrir(){
  await carregar(); $("#login").hidden=true; $("#app").hidden=false;
}
["filial","area","tempo","funcao"].forEach(c=>$("#f-"+c).addEventListener("change",e=>{F[c]=e.target.value;render();}));
$("#f-limpar").addEventListener("click",()=>{F={filial:"",area:"",tempo:"",funcao:""};montarFiltros();render();});
$("#b-atual").addEventListener("click",()=>carregar().catch(sair));
$("#b-resumo").addEventListener("click",exportarResumo);
$("#b-bruto").addEventListener("click",exportarBruto);
$("#b-print").addEventListener("click",()=>window.print());
function apresentar(on){
  document.body.classList.toggle("pres",on);
  try{ if(on&&document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); else if(!on&&document.fullscreenElement) document.exitFullscreen(); }catch(_){}
  window.scrollTo({top:0});
}
$("#b-apres").addEventListener("click",()=>apresentar(true));
$("#sairpres").addEventListener("click",()=>apresentar(false));
document.addEventListener("fullscreenchange",()=>{ if(!document.fullscreenElement) document.body.classList.remove("pres"); });
document.addEventListener("keydown",e=>{
  if(!document.body.classList.contains("pres")) return;
  const i=TABS.findIndex(t=>t[0]===tab);
  if(e.key==="ArrowRight"&&i<TABS.length-1) irTab(TABS[i+1][0]);
  if(e.key==="ArrowLeft"&&i>0) irTab(TABS[i-1][0]);
  if(e.key==="Escape") apresentar(false);
});
function sair(){ token=null; rows=[]; try{sessionStorage.removeItem("clima_tk");}catch(_){} $("#app").hidden=true; $("#login").hidden=false; $("#pw").value=""; }
$("#b-sair").addEventListener("click",sair);
document.addEventListener("click",e=>{
  const tb=e.target.closest(".tabs button"); if(tb){ irTab(tb.dataset.t); return; }
  const tg=e.target.closest(".tg"); if(tg){ verUn=tg.dataset.un; render(); return; }
  const un=e.target.closest("tr.un"); if(un){ F[un.dataset.c]=un.dataset.v; montarFiltros(); tab="visao"; render(); return; }
  const b=e.target.closest(".mais"); if(b){ verMais[b.dataset.n]=true; render(); } });
(async()=>{ try{ const t=sessionStorage.getItem("clima_tk"); if(t){ token=t; await abrir(); } }catch(_){ sair(); } })();
</script>
